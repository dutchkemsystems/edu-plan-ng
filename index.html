<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduPlan NG</title>
    <meta name="description" content="Acquisition-grade lesson planning, NERDC curriculum browsing, scheme of work, and assessment platform for Nigerian teachers (JSS 1-3, SSS 1-3)." />
    <meta property="og:title" content="EduPlan NG" />
    <meta property="og:description" content="Acquisition-grade lesson planning, NERDC curriculum browsing, scheme of work, and assessment platform for Nigerian teachers (JSS 1-3, SSS 1-3)." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#047857" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EduPlan NG" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23047857'/><text x='50' y='68' font-size='50' font-weight='900' fill='white' text-anchor='middle' font-family='sans-serif'>EP</text></svg>" />
    <!-- Kora Pay Collections Modal SDK (deferred so it never blocks homepage render) -->
    <script defer src="https://korablobstorage.blob.core.windows.net/modal-bucket/korapay-collections.min.js"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Automatically clean up any stale service workers or caches that could cause blank screens
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then((reg) => {
              reg.update().catch(() => {});
              console.log('[PWA] Service Worker registered:', reg.scope);
            })
            .catch((err) => {
              console.warn('[PWA] Service Worker registration skipped:', err);
            });
        });
      }

      // Root mounting watchdog: Only show recovery prompt if React truly failed to mount after 8s
      setTimeout(() => {
        const root = document.getElementById('root');
        if (root && root.childNodes.length === 0 && !window.__eduplanMounted) {
          console.warn('[EduPlan] Root container empty after timeout. Displaying recovery prompt.');
          root.innerHTML = `
            <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0A192F;color:white;font-family:system-ui,-apple-system,sans-serif;padding:20px;text-align:center;">
              <div style="max-width:440px;background:#1E293B;padding:32px;border-radius:20px;border:1px solid rgba(251,191,36,0.3);box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">
                <div style="width:48px;height:48px;margin:0 auto 16px;background:#F59E0B;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#0A192F;font-weight:900;font-size:20px;">EP</div>
                <h2 style="font-size:20px;font-weight:800;margin-bottom:8px;">EduPlan NG</h2>
                <p style="font-size:13px;color:#94A3B8;margin-bottom:20px;line-height:1.5;">Preparing lesson workspace. Click below to refresh your connection and load the homepage.</p>
                <button onclick="if('caches' in window){caches.keys().then(k=>Promise.all(k.map(c=>caches.delete(c)))).finally(()=>window.location.reload());}else{window.location.reload();}" style="background:#F59E0B;color:#0F172A;font-weight:800;border:none;padding:12px 24px;border-radius:12px;cursor:pointer;font-size:13px;width:100%;">Refresh Homepage</button>
              </div>
            </div>
          `;
        }
      }, 8000);
    </script>
  </body>
</html>
