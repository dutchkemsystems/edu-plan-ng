name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy-vercel:
    name: Production Deployment to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Deploy to Vercel
        run: echo "Vercel deployment simulated successfully for release tag."
